plugins {
    id "com.android.application"
}

android {
    namespace "com.arktechcore.instadrop"
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.arktechcore.instadrop"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        def apiBase = providers.gradleProperty("INSTADROP_API_BASE")
                .orElse("https://instadrop.YOUR-CLOUDFLARE-DOMAIN.workers.dev")
                .get()
        buildConfigField "String", "INSTADROP_API_BASE", "\"${apiBase}\""
    }
}
